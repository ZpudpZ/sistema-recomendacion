services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recsys-backend
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
    expose:
      - "8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recsys-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"